<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知栏</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        /* 右侧通知栏专用样式 */
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #ccc;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .notify-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #2a3a5e;
            cursor: pointer;
            user-select: none;
        }
        .notify-header .title {
            font-size: 14px;
            color: #aaa;
        }
        .notify-header .toggle-btn {
            font-size: 16px;
            color: #666;
            transition: transform 0.3s;
        }
        .notify-header .toggle-btn.collapsed {
            transform: rotate(-90deg);
        }
        .notify-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            transition: max-height 0.3s ease;
        }
        .notify-body.collapsed {
            max-height: 0;
            padding: 0 12px;
            overflow: hidden;
        }
        .notify-item {
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 4px;
            font-size: 13px;
            border-left: 3px solid;
            background: #0f1a2f;
        }
        .notify-item.error {
            border-left-color: #f44336;
            color: #f44336;
        }
        .notify-item.warning {
            border-left-color: #ff9800;
            color: #ff9800;
        }
        .notify-item.info {
            border-left-color: #4CAF50;
            color: #4CAF50;
        }
        .notify-item .time {
            font-size: 11px;
            color: #666;
            float: right;
        }
        .notify-empty {
            color: #555;
            text-align: center;
            padding: 20px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="notify-header" id="notify-header">
        <span class="title">🔔 通知</span>
        <span class="toggle-btn" id="toggle-btn">▶</span>
    </div>
    <div class="notify-body" id="notify-body">
        <div class="notify-empty">暂无通知</div>
    </div>

    <script>
        (function() {
            const body = document.getElementById('notify-body');
            const toggleBtn = document.getElementById('toggle-btn');
            let collapsed = false;

            // 从 localStorage 恢复状态
            const saved = localStorage.getItem('notifyCollapsed');
            if (saved === 'true') {
                collapsed = true;
                body.classList.add('collapsed');
                toggleBtn.classList.add('collapsed');
            }

            // 切换折叠
            document.getElementById('notify-header').addEventListener('click', function() {
                collapsed = !collapsed;
                body.classList.toggle('collapsed');
                toggleBtn.classList.toggle('collapsed');
                localStorage.setItem('notifyCollapsed', collapsed);
            });

            // 接收来自父窗口的通知消息
            window.addEventListener('message', function(event) {
                if (event.origin !== window.location.origin) return;
                const data = event.data;
                if (data.type === 'notify') {
                    addNotification(data.level || 'info', data.message);
                }
            });

            function addNotification(level, message) {
                // 移除空状态
                const empty = body.querySelector('.notify-empty');
                if (empty) empty.remove();

                const item = document.createElement('div');
                item.className = 'notify-item ' + level;
                const time = new Date().toLocaleTimeString();
                item.innerHTML = `<span class="time">${time}</span> ${message}`;
                body.prepend(item);

                // 限制条目数，最多 50 条
                while (body.children.length > 50) {
                    body.removeChild(body.lastChild);
                }
            }

            // 暴露给父窗口调用
            window.parent.postMessage({ type: 'notify-ready' }, '*');
        })();
    </script>
</body>
</html>
