<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下载管理 - wow</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h2 {
            margin: 0;
            color: #ccd;
            font-weight: 400;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            margin: 14px;
            background: #141e2b;
            border-radius: 8px;
            padding: 4px;
            overflow-x: auto;
        }
        .tab-btn {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #8899aa;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn:hover {
            color: #ccd;
            background: #1a2332;
        }
        .tab-btn.active {
            background: #4CAF50;
            color: white;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.2s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0.5; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-left: 14px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            background: #0f1a2f;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #ccd;
            font-size: 14px;
            outline: none;
            min-width: 180px;
        }
        .search-bar input:focus {
            border-color: #4CAF50;
        }
        .search-bar select {
            padding: 8px 12px;
            background: #0f1a2f;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #ccd;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .search-bar select:focus {
            border-color: #4CAF50;
        }
        .search-bar .btn-search {
            padding: 8px 24px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-right: 14px;
        }
        .search-bar .btn-search:hover {
            background: #1976D2;
        }
        .search-bar .btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 520px;
            overflow-y: auto;
        }
        .result-item {
            background: #141e2b;
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            border-left: 3px solid transparent;
        }
        .result-item:hover {
            background: #1a2332;
        }
        .result-item .info {
            flex: 1;
        }
        .result-item .info .name {
            color: #ccd;
            font-size: 14px;
            font-weight: 500;
        }
        .result-item .info .meta {
            color: #667788;
            font-size: 12px;
            margin-top: 2px;
        }
        .result-item .info .meta .tag {
            display: inline-block;
            background: #1a2332;
            padding: 0 8px;
            border-radius: 4px;
            margin-right: 6px;
            color: #8899aa;
            font-size: 11px;
        }
        .result-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .result-item .actions .btn-sm {
            padding: 4px 14px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }
        .btn-sm.download { background: #4CAF50; }
        .btn-sm.download:hover { background: #388E3C; }
        .btn-sm.info { background: #2196F3; }
        .btn-sm.info:hover { background: #1976D2; }
        .btn-sm.deps { background: #ff9800; }
        .btn-sm.deps:hover { background: #f57c00; }
        .btn-sm.core { background: #9C27B0; }
        .btn-sm.core:hover { background: #7B1FA2; }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #667788;
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #16213e;
            border-left: 4px solid #4CAF50;
            padding: 12px 20px;
            border-radius: 6px;
            color: #ccd;
            font-size: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .toast.error { border-left-color: #f44336; }
        .toast.success { border-left-color: #4CAF50; }
        .toast.warning { border-left-color: #ff9800; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1a2332;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .core-form {
            background: #141e2b;
            border-radius: 8px;
            padding: 20px;
        }
        .core-form .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .core-form .form-group {
            flex: 1;
            min-width: 160px;
        }
        .core-form .form-group label {
            display: block;
            font-size: 13px;
            color: #8899aa;
            margin-bottom: 4px;
        }
        .core-form .form-group input,
        .core-form .form-group select {
            width: 100%;
            padding: 8px 12px;
            background: #0f1a2f;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #ccd;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .core-form .form-group input:focus,
        .core-form .form-group select:focus {
            border-color: #4CAF50;
        }
        .core-form .btn-download-core {
            padding: 10px 32px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .core-form .btn-download-core:hover {
            background: #388E3C;
        }
        .core-form .btn-download-core:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .core-form .hint {
            color: #667788;
            font-size: 13px;
            margin-top: 8px;
        }

        .queue-status {
            margin-top: 16px;
            padding: 12px 16px;
            background: #0f1a2f;
            border-radius: 6px;
            color: #8899aa;
            font-size: 13px;
        }

        /* ===== 任务队列进度条 ===== */
        .queue-item .progress-wrap {
            margin-top: 8px;
            height: 6px;
            background: #16233a;
            border-radius: 3px;
            overflow: hidden;
        }
        .queue-item .progress-wrap .bar {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            background: linear-gradient(90deg, #2196F3, #4CAF50);
            transition: width .3s ease;
        }
        .queue-item .stage {
            margin-top: 6px;
            font-size: 12px;
            color: #7d8ea3;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }
        .queue-item .stage-detail {
            margin-top: 6px;
            max-height: 108px;
            overflow-y: auto;
            background: #0b1424;
            border: 1px solid #1b2b44;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 11.5px;
            line-height: 1.6;
            color: #6f8299;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .queue-item .stage-detail::-webkit-scrollbar { width: 5px; }
        .queue-item .stage-detail::-webkit-scrollbar-thumb { background: #24395a; border-radius: 3px; }
        .badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 16px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .badge.running { background: #123a5c; color: #4fc3f7; }
        .badge.done    { background: #14331f; color: #66bb6a; }
        .badge.failed  { background: #3d1414; color: #ef5350; }
        .badge.waiting { background: #2a2a1a; color: #c0a94a; }

        @media (max-width: 700px) {
            .search-bar { flex-direction: column; align-items: stretch; }
            .search-bar input { min-width: auto; }
            .result-item { flex-direction: column; align-items: stretch; gap: 8px; }
            .result-item .actions { margin-left: 0; flex-wrap: wrap; }
            .core-form .form-row { flex-direction: column; }
        }

        /* ===== V3.8.0：选方案安装弹窗 ===== */
        .modal-mask {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0, 0, 0, .62);
            display: none; align-items: center; justify-content: center;
        }
        .modal-mask.active { display: flex; }
        .modal-box {
            background: #16223a; border: 1px solid #2a3b5c; border-radius: 10px;
            padding: 22px; width: min(470px, 92vw);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-box h3 { margin: 0 0 6px; font-size: 18px; color: #e6edf7; }
        .modal-box .modal-sub { font-size: 13px; color: #8fa3c0; margin-bottom: 16px; line-height: 1.6; }
        .modal-field { margin-bottom: 14px; }
        .modal-field label { display: block; font-size: 13px; color: #b8c8e0; margin-bottom: 6px; }
        .modal-field select {
            width: 100%; padding: 9px 12px; background: #0f1a2f;
            border: 1px solid #2a3b5c; border-radius: 6px; color: #ccd; font-size: 14px;
        }
        .modal-check {
            display: flex; gap: 8px; align-items: flex-start;
            font-size: 13px; color: #b8c8e0; line-height: 1.5; margin-bottom: 6px;
        }
        .modal-check input { margin-top: 3px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .modal-actions button {
            padding: 9px 18px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        .modal-actions .cancel { background: #2a3b5c; color: #ccd; }
        .modal-actions .confirm { background: #4CAF50; color: #fff; }
        .modal-actions .confirm:disabled { opacity: .5; cursor: not-allowed; }
        .modal-warn { font-size: 12px; color: #ffb74d; margin-top: 10px; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="down-page">
        <div class="page-header">
            <h2> 📥 下载管理</h2>
        </div>

        <!-- Tab 切换 -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="mods">🔍 模组搜索</button>
            <button class="tab-btn" data-tab="plugins">🔌 插件搜索</button>
            <button class="tab-btn" data-tab="core">⬇️ 核心下载</button>
            <button class="tab-btn" data-tab="queue">📋 下载队列</button>
        </div>

        <!-- ===== 模组搜索 Tab ===== -->
        <div class="tab-content active" id="tab-mods">
            <div class="search-bar">
                <select id="mod-source" title="下载源（默认优先 Modrinth）">
                    <option value="modrinth" selected>Modrinth（默认优先）</option>
                    <option value="curseforge">CurseForge（次选）</option>
                </select>
                <input type="text" id="mod-search-input" placeholder="搜索模组名称..." />
                <select id="mod-category-filter" title="类别">
                    <option value="">全部类别</option>
                    <option value="technology">科技</option>
                    <option value="magic">魔法</option>
                    <option value="optimization">优化</option>
                    <option value="adventure">冒险</option>
                    <option value="library">API / 库</option>
                </select>
                <input type="text" id="mod-version-filter" placeholder="MC 版本 如 1.20.1" style="max-width:170px;flex:0 1 170px;" />
                <select id="mod-loader-filter" title="加载器">
                    <option value="">全部加载器</option>
                    <option value="forge">Forge</option>
                    <option value="fabric">Fabric</option>
                    <option value="neoforge">NeoForge</option>
                    <option value="quilt">Quilt</option>
                </select>
                <button class="btn-search" id="mod-search-btn">🔍 搜索</button>
            </div>
            <div id="mod-results" class="result-list">
                <div class="empty-state">
                    <div class="icon">🔎</div>
                    <div>输入关键词搜索模组</div>
                    <div style="font-size:12px;color:#556677;margin-top:4px;">默认优先 Modrinth；点「下载」后必须选择要安装到哪个方案</div>
                </div>
            </div>
        </div>

        <!-- ===== 插件搜索 Tab（Minecraft 服务端插件，非 wow扩展） ===== -->
        <div class="tab-content" id="tab-plugins">
            <div class="search-bar">
                <select id="plugin-source" title="下载源（默认优先 Modrinth）">
                    <option value="modrinth" selected>Modrinth（默认优先）</option>
                    <option value="curseforge">CurseForge（次选）</option>
                </select>
                <input type="text" id="plugin-search-input" placeholder="搜索服务端插件名称..." />
                <select id="plugin-category-filter" title="类别">
                    <option value="">全部类别</option>
                    <option value="technology">科技</option>
                    <option value="magic">魔法</option>
                    <option value="optimization">优化</option>
                    <option value="adventure">冒险</option>
                    <option value="library">API / 库</option>
                </select>
                <input type="text" id="plugin-version-filter" placeholder="MC 版本 如 1.20.1" style="max-width:170px;flex:0 1 170px;" />
                <select id="plugin-loader-filter" title="插件加载器">
                    <option value="">全部加载器</option>
                    <option value="bukkit">Bukkit</option>
                    <option value="spigot">Spigot</option>
                    <option value="paper">Paper</option>
                    <option value="purpur">Purpur</option>
                    <option value="folia">Folia</option>
                </select>
                <button class="btn-search" id="plugin-search-btn">🔍 搜索</button>
            </div>
            <div id="plugin-results" class="result-list">
                <div class="empty-state">
                    <div class="icon">🔌</div>
                    <div>搜索 Bukkit / Paper 等服务端插件</div>
                    <div style="font-size:12px;color:#556677;margin-top:4px;">与「模组搜索」同样支持选方案、类别筛选与自动解析依赖</div>
                </div>
            </div>
        </div>

        <!-- ===== 核心下载 Tab ===== -->
        <div class="tab-content" id="tab-core">
            <div class="core-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>核心类型</label>
                        <select id="core-type">
                            <option value="vanilla">Vanilla (原版)</option>
                            <option value="forge">Forge</option>
                            <option value="fabric">Fabric</option>
                            <option value="neoforge">NeoForge</option>
                            <option value="paper">Paper</option>
                            <option value="purpur">Purpur</option>
                            <option value="spigot">Spigot</option>
                            <option value="mohist">Mohist</option>
                            <option value="catserver">CatServer</option>
                            <option value="arclight">Arclight</option>
                            <option value="leaves">Leaves</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Minecraft 版本</label>
                        <input type="text" id="core-version" placeholder="1.20.1" value="1.20.1" />
                    </div>
                    <div class="form-group" id="build-group">
                        <label>构建号 (仅 Mohist)</label>
                        <input type="text" id="core-build" placeholder="例如: 346" />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>下载来源</label>
                        <select id="core-mirror">
                            <option value="bmclapi">BMCLAPI2 (推荐)</option>
                            <option value="mojang">Mojang 官方</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div class="form-group" id="custom-mirror-group" style="display:none;">
                        <label>自定义镜像 URL</label>
                        <input type="text" id="custom-mirror-url" placeholder="https://mirror.example.com/" />
                    </div>
                </div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
                    <button class="btn-download-core" id="core-download-btn">⬇️ 下载核心</button>
                    <span style="color:#667788;font-size:13px;" id="core-status">就绪</span>
                </div>
                <div class="hint">
                    💡 核心将下载到当前方案目录，并自动添加到 pool 供其他方案复用。
                    版本列表请参考各服务端官方文档。
                </div>
            </div>
        </div>

        <!-- ===== 下载队列 Tab ===== -->
        <div class="tab-content" id="tab-queue">
            <div id="queue-list" class="result-list">
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div>暂无下载任务</div>
                    <div style="font-size:12px;color:#556677;margin-top:4px;">从模组搜索、插件搜索或核心下载添加的任务会显示在这里</div>
                </div>
            </div>
            <div class="queue-status" id="queue-status">
                状态: 空闲
            </div>
        </div>
    </div>

    <!-- Toast 消息 -->
    <div class="toast" id="toast"></div>

    <!-- ===== V3.8.0：选方案安装弹窗（模组 / 插件共用） ===== -->
    <div class="modal-mask" id="install-modal">
        <div class="modal-box">
            <h3 id="install-modal-title">安装到方案</h3>
            <div class="modal-sub" id="install-modal-sub"></div>
            <div class="modal-field">
                <label for="install-scheme-select">目标方案（必选 · 禁止默认塞入当前方案）</label>
                <select id="install-scheme-select">
                    <option value="">— 请选择方案 —</option>
                </select>
            </div>
            <label class="modal-check">
                <input type="checkbox" id="install-auto-resolve" checked />
                <span>自动选择合适的版本并拉取前置依赖
                    <br><span style="color:#8fa3c0;font-size:12px;">按所选方案的 MC 版本与加载器匹配最适配文件；模组自动递归抓取必需依赖（最多 3 层）。</span>
                </span>
            </label>
            <div class="modal-warn" id="install-cf-warn" style="display:none;">
                ⚠️ CurseForge 为次选源：依赖解析为尽力而为，且可能需要 BYOK / 代理；API 超时会自动降级并给出提示。
            </div>
            <div class="modal-actions">
                <button class="cancel" id="install-cancel-btn">取消</button>
                <button class="confirm" id="install-confirm-btn">⬇️ 确认安装</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        (function() {
            const token = sessionStorage.getItem('wow_token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            // ==================== DOM 引用 ====================
            const tabs = document.querySelectorAll('.tab-btn');
            const modSource = document.getElementById('mod-source');
            const modSearchInput = document.getElementById('mod-search-input');
            const modLoaderFilter = document.getElementById('mod-loader-filter');
            const modSearchBtn = document.getElementById('mod-search-btn');
            const modResults = document.getElementById('mod-results');
            const modCategoryFilter = document.getElementById('mod-category-filter');
            const modVersionFilter = document.getElementById('mod-version-filter');
            const pluginSource = document.getElementById('plugin-source');
            const pluginSearchInput = document.getElementById('plugin-search-input');
            const pluginCategoryFilter = document.getElementById('plugin-category-filter');
            const pluginVersionFilter = document.getElementById('plugin-version-filter');
            const pluginLoaderFilter = document.getElementById('plugin-loader-filter');
            const pluginSearchBtn = document.getElementById('plugin-search-btn');
            const pluginResults = document.getElementById('plugin-results');
            // V3.8.0 选方案安装弹窗
            const installModal = document.getElementById('install-modal');
            const installSchemeSelect = document.getElementById('install-scheme-select');
            const installAutoResolve = document.getElementById('install-auto-resolve');
            const installTitle = document.getElementById('install-modal-title');
            const installSub = document.getElementById('install-modal-sub');
            const installCfWarn = document.getElementById('install-cf-warn');
            const installConfirmBtn = document.getElementById('install-confirm-btn');
            const installCancelBtn = document.getElementById('install-cancel-btn');
            let pendingInstall = null;   // 当前弹窗对应的项目
            const coreType = document.getElementById('core-type');
            const coreVersion = document.getElementById('core-version');
            const coreBuild = document.getElementById('core-build');
            const coreMirror = document.getElementById('core-mirror');
            const customMirrorGroup = document.getElementById('custom-mirror-group');
            const customMirrorUrl = document.getElementById('custom-mirror-url');
            const coreDownloadBtn = document.getElementById('core-download-btn');
            const coreStatus = document.getElementById('core-status');
            const queueList = document.getElementById('queue-list');
            const queueStatus = document.getElementById('queue-status');
            const toastEl = document.getElementById('toast');

            // ==================== Toast ====================
            let toastTimer = null;
            function showToast(message, type = 'info', duration = 4000) {
                toastEl.textContent = message;
                toastEl.className = 'toast ' + type;
                void toastEl.offsetWidth;
                toastEl.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, duration);
            }

            // ==================== API 封装 ====================
            async function apiExec(command, args = []) {
                const resp = await fetch('/api/exec', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ command, args })
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || '请求失败');
                }
                return await resp.json();
            }

            async function apiGet(path) {
                const resp = await fetch(path, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) throw new Error('请求失败');
                return await resp.json();
            }

            // ==================== 任务队列（后端 /api/tasks 驱动） ====================
            // 队列数据完全来自后端 download_queue（含 web_task.js 异步任务），
            // 前端只负责渲染。旧实现是纯前端数组，刷新即丢，且拿不到任何进度。
            let taskItems = [];
            let taskSocket = null;

            const STATUS_TEXT = {
                running: '进行中',
                waiting: '排队中',
                pending: '排队中',
                done: '已完成',
                success: '已完成',
                failed: '失败',
                error: '失败',
                canceled: '已取消'
            };

            function normStatus(s) {
                const k = String(s || '').toLowerCase();
                if (k === 'success') return 'done';
                if (k === 'error') return 'failed';
                if (k === 'pending') return 'waiting';
                return STATUS_TEXT[k] ? k : 'waiting';
            }

            function statusColor(st) {
                return st === 'done' ? '#4CAF50' : st === 'failed' ? '#f44336'
                    : st === 'running' ? '#2196F3' : '#ff9800';
            }

            function iconOf(t) {
                const s = String(t || '').toLowerCase();
                if (s.includes('创建')) return '🏗️';
                if (s.includes('拉取')) return '📥';
                if (s.includes('瘦身')) return '🧹';
                if (s.includes('核心')) return '⚙️';
                if (s.includes('模组')) return '🧩';
                return '📦';
            }

            function progressBar(item) {
                const st = normStatus(item.status);
                const pct = Math.max(0, Math.min(100, Number(item.progress) || 0));
                const width = st === 'done' ? 100 : pct;
                const color = statusColor(st);
                const barStyle = st === 'done'
                    ? 'background:#4CAF50;'
                    : st === 'failed'
                        ? 'background:#f44336;'
                        : `background:linear-gradient(90deg,#2196F3,${color});`;
                return `<div class="progress-wrap"><div class="bar" style="width:${width}%;${barStyle}"></div></div>`;
            }

            function renderQueue() {
                if (!taskItems.length) {
                    queueList.innerHTML = `<div class="empty-state">
                        <div class="icon">📭</div>
                        <div>暂无下载任务</div>
                        <div style="font-size:12px;color:#556677;margin-top:4px;">从方案页创建方案、或在此下载核心后，任务会显示在这里</div>
                    </div>`;
                    queueStatus.textContent = '状态: 空闲';
                    return;
                }

                let html = '';
                for (const item of taskItems) {
                    const st = normStatus(item.status);
                    const color = statusColor(st);
                    const pct = st === 'done' ? 100 : Math.max(0, Math.min(100, Number(item.progress) || 0));
                    const stage = item.stage || (st === 'done' ? '已完成' : st === 'failed' ? '执行失败' : '等待中');
                    const logs = Array.isArray(item.logs) ? item.logs.slice(-6).join('\n') : '';
                    const time = item.time || item.createdAt || '';
                    const type = item.type || '任务';

                    html += `<div class="result-item queue-item" data-id="${escapeHtml(item.id || '')}" style="border-left-color:${color};align-items:stretch;">
                        <div class="info" style="flex:1;min-width:0;">
                            <div class="name">${iconOf(type)} ${escapeHtml(item.name || item.command || '未命名任务')}
                                <span class="badge ${st}">${STATUS_TEXT[st] || st}</span>
                                <span style="float:right;color:${color};font-size:12.5px;font-weight:600;">${pct}%</span>
                            </div>
                            <div class="meta">${escapeHtml(type)}${item.pid ? ' · PID ' + item.pid : ''}${time ? ' · ' + escapeHtml(String(time)) : ''}</div>
                            ${progressBar(item)}
                            <div class="stage">${escapeHtml(stage)} · ${pct}%</div>
                            ${logs ? `<div class="stage-detail">${escapeHtml(logs)}</div>` : ''}
                        </div>
                    </div>`;
                }
                queueList.innerHTML = html;
                const running = taskItems.filter(t => normStatus(t.status) === 'running').length;
                queueStatus.textContent = `状态: ${taskItems.length} 个任务${running ? `（${running} 个进行中）` : ''}`;
            }

            async function loadTasks() {
                try {
                    const data = await apiGet('/api/tasks');
                    taskItems = Array.isArray(data.tasks) ? data.tasks : [];
                    renderQueue();
                } catch (e) {
                    // 接口不可用时保持原样，不打断用户
                }
            }

            // 兼容旧调用点：全部改为刷新后端任务
            function addToQueue() {
                loadTasks();
            }

            function upsertTask(task) {
                if (!task || !task.id) return;
                const idx = taskItems.findIndex(t => t.id === task.id);
                if (idx >= 0) {
                    taskItems[idx] = Object.assign({}, taskItems[idx], task);
                } else {
                    taskItems.unshift(task);
                }
                if (taskItems.length > 50) taskItems = taskItems.slice(0, 50);
                renderQueue();
            }

            function connectTaskSocket() {
                if (typeof io !== 'function') {
                    // socket.io 客户端没加载成功时退回轮询
                    setInterval(loadTasks, 3000);
                    return;
                }
                try {
                    taskSocket = io({ auth: { token } });
                } catch (e) {
                    setInterval(loadTasks, 3000);
                    return;
                }
                taskSocket.on('connect', () => { loadTasks(); });
                taskSocket.on('tasks', (payload) => {
                    if (payload && Array.isArray(payload.tasks)) {
                        taskItems = payload.tasks;
                        if (taskItems.length > 50) taskItems = taskItems.slice(0, 50);
                        renderQueue();
                    }
                });
                taskSocket.on('task', (task) => { upsertTask(task); });
            }

            // ==================== Tab 切换 ====================
            function activateTab(name) {
                if (!name) return;
                const btn = document.querySelector(`.tab-btn[data-tab="${name}"]`);
                if (!btn) return;
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                const target = document.getElementById('tab-' + name);
                if (target) target.classList.add('active');
            }

            tabs.forEach(btn => {
                btn.addEventListener('click', () => {
                    activateTab(btn.dataset.tab);
                });
            });

            // ==================== 核心镜像切换 ====================
            coreMirror.addEventListener('change', () => {
                if (coreMirror.value === 'custom') {
                    customMirrorGroup.style.display = 'block';
                } else {
                    customMirrorGroup.style.display = 'none';
                }
            });

            // ==================== 内容搜索（模组 / 插件共用，V3.8.0） ====================
            // 默认源 Modrinth；支持类别 / MC 版本 / 加载器 / projectType 筛选。
            // 「下载」不再直接 down <url> 落共享池，而是打开「选方案安装」弹窗。
            function searchUi(kind) {
                const isPlugin = kind === 'plugins';
                return {
                    source: isPlugin ? pluginSource : modSource,
                    query: isPlugin ? pluginSearchInput : modSearchInput,
                    category: isPlugin ? pluginCategoryFilter : modCategoryFilter,
                    version: isPlugin ? pluginVersionFilter : modVersionFilter,
                    loader: isPlugin ? pluginLoaderFilter : modLoaderFilter,
                    btn: isPlugin ? pluginSearchBtn : modSearchBtn,
                    results: isPlugin ? pluginResults : modResults,
                    label: isPlugin ? '插件' : '模组',
                    projectType: isPlugin ? 'plugin' : 'mod',
                    kind: isPlugin ? 'plugins' : 'mods'
                };
            }

            async function searchContent(kind) {
                const ui = searchUi(kind);
                const query = ui.query.value.trim();
                if (!query) { showToast('请输入搜索关键词', 'warning'); return; }
                const source = ui.source.value || 'modrinth';
                const params = new URLSearchParams({
                    source, query,
                    loader: ui.loader.value,
                    version: ui.version.value.trim(),
                    category: ui.category.value,
                    projectType: ui.projectType
                });

                ui.btn.disabled = true;
                ui.btn.textContent = '搜索中...';
                ui.results.innerHTML = `<div class="empty-state"><div class="loading-spinner"></div><div>正在从 ${source === 'modrinth' ? 'Modrinth' : 'CurseForge'} 搜索${ui.label}...</div></div>`;

                try {
                    const data = await apiGet('/api/mod/search?' + params.toString());
                    const list = data.results || [];
                    if (!list.length) {
                        ui.results.innerHTML = `<div class="empty-state">
                            <div class="icon">😕</div>
                            <div>未找到匹配的${ui.label}</div>
                            <div style="font-size:12px;color:#556677;margin-top:4px;">尝试更换关键词、类别、MC 版本或来源</div>
                        </div>`;
                        return;
                    }
                    ui.results.innerHTML = list.map(item => {
                        const loaders = (item.loaders || []).map(l => `<span class="tag">${escapeHtml(l)}</span>`).join('');
                        const project = item.project_id || item.slug || item.name;
                        const attrs = `data-project="${escapeHtml(project)}" data-name="${escapeHtml(item.name)}" ` +
                            `data-source="${escapeHtml(source)}" data-kind="${ui.kind}"`;
                        return `<div class="result-item">
                            <div class="info">
                                <div class="name">${escapeHtml(item.name)}</div>
                                <div class="meta">
                                    ${escapeHtml(item.author || '未知作者')} ·
                                    版本 ${escapeHtml(item.version || 'latest')} ·
                                    下载 ${escapeHtml(item.downloads || '0')} ·
                                    ${loaders}
                                    ${item.summary ? '<br>' + escapeHtml(item.summary.slice(0, 100)) : ''}
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn-sm download" ${attrs}>⬇️ 下载</button>
                                <button class="btn-sm deps" ${attrs}>📦 依赖</button>
                                <button class="btn-sm info" ${attrs}>ℹ️ 详情</button>
                            </div>
                        </div>`;
                    }).join('');
                    bindResultButtons(ui.results);
                } catch (e) {
                    ui.results.innerHTML = `<div class="empty-state" style="color:#f44336;">
                        <div class="icon">❌</div>
                        <div>搜索失败: ${escapeHtml(e.message)}</div>
                    </div>`;
                } finally {
                    ui.btn.disabled = false;
                    ui.btn.textContent = '🔍 搜索';
                }
            }

            function bindResultButtons(container) {
                container.querySelectorAll('.result-item .download').forEach(el => {
                    el.addEventListener('click', () => openInstallModal({
                        project: el.dataset.project,
                        name: el.dataset.name,
                        source: el.dataset.source,
                        kind: el.dataset.kind
                    }));
                });
                // 详情 / 依赖打开同一个「项目详情 + 依赖清单」弹层（依赖按钮不再形同虚设）
                container.querySelectorAll('.result-item .btn-sm.info, .result-item .btn-sm.deps').forEach(el => {
                    el.addEventListener('click', () => showContentInfo(el.dataset.project, el.dataset.source));
                });
            }

            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ==================== 异步任务提交 ====================
            // 统一入口：先尝试 POST /api/tasks/run（毫秒返回 + 队列页出进度），
            // 被 command_policy 拒绝或无白名单时，回退到 /api/exec 同步执行。
            async function apiTask(command, args, name, type) {
                const resp = await fetch('/api/tasks/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ command, args, name, type })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok || !data.success) {
                    const err = new Error(data.error || '提交任务失败');
                    err.code = data.code;
                    err.status = resp.status;
                    throw err;
                }
                return data;
            }

            // ==================== 选方案安装弹窗（V3.8.0 P0） ====================
            /**
             * 铁律：目标方案必须**由用户显式选择**，弹窗默认项是「— 请选择方案 —」，
             * 绝不预填当前方案，也不允许在未选时提交。
             */
            async function loadInstallSchemes() {
                try {
                    const data = await apiGet('/api/schemes');
                    const names = (data.schemes || [])
                        .map(s => (typeof s === 'string' ? s : (s && s.name) || ''))
                        .filter(Boolean);
                    installSchemeSelect.innerHTML = '<option value="">— 请选择方案 —</option>';
                    for (const n of names) {
                        const opt = document.createElement('option');
                        opt.value = n;
                        opt.textContent = n;
                        installSchemeSelect.appendChild(opt);
                    }
                    if (!names.length) showToast('当前还没有任何方案，请先在「方案」页创建一个', 'warning');
                } catch (e) {
                    showToast('方案列表加载失败: ' + e.message, 'error');
                }
            }

            async function openInstallModal(item) {
                if (!item || !item.project) return;
                pendingInstall = item;
                installTitle.textContent = `安装${item.kind === 'plugins' ? '插件' : '模组'}「${item.name || item.project}」`;
                installSub.innerHTML =
                    `项目 ID：<code>${escapeHtml(item.project)}</code> · 来源：${escapeHtml(item.source)}<br>` +
                    `将按<strong>所选方案</strong>的 MC 版本与加载器自动匹配最合适的文件，` +
                    `安装到 scheme/&lt;方案&gt;/${item.kind === 'plugins' ? 'plugins' : 'mods'}/。`;
                installCfWarn.style.display = (item.source === 'curseforge') ? 'block' : 'none';
                installAutoResolve.checked = true;
                installModal.classList.add('active');
                await loadInstallSchemes();
            }

            function closeInstallModal() {
                installModal.classList.remove('active');
                pendingInstall = null;
                installConfirmBtn.disabled = false;
            }

            async function confirmInstall() {
                if (!pendingInstall) return;
                const scheme = installSchemeSelect.value;
                if (!scheme) {
                    showToast('必须先选择一个目标方案（禁止默认塞入当前方案）', 'warning');
                    return;
                }
                const item = pendingInstall;
                const args = [
                    item.project,
                    '--scheme', scheme,
                    '--kind', item.kind,
                    '--source', item.source
                ];
                if (!installAutoResolve.checked) args.push('--no-auto');
                installConfirmBtn.disabled = true;
                try {
                    await apiTask('mod install', args,
                        `${item.name || item.project} → ${scheme}`,
                        item.kind === 'plugins' ? '插件' : '模组');
                    showToast(`⏳ 已提交安装「${item.name || item.project}」到方案 ${scheme}，进度见下载队列`, 'success');
                    closeInstallModal();
                    activateTab('queue');
                    await loadTasks();
                } catch (e) {
                    showToast(`❌ 提交失败: ${e.message}`, 'error');
                    installConfirmBtn.disabled = false;
                }
            }

            installCancelBtn.addEventListener('click', closeInstallModal);
            installConfirmBtn.addEventListener('click', confirmInstall);
            installModal.addEventListener('click', (e) => {
                if (e.target === installModal) closeInstallModal();
            });

            // ==================== 项目详情 / 依赖清单 ====================
            async function showContentInfo(project, source) {
                try {
                    const data = await apiGet(`/api/mod/info?source=${encodeURIComponent(source)}&project=${encodeURIComponent(project)}`);
                    const deps = (data.dependencies || []).length
                        ? (data.dependencies || []).map(d =>
                            `  · ${d.project_id || d.name || d.slug || String(d)}（${d.dependency_type || 'required'}）`).join('\n')
                        : '  无（或该来源未提供依赖信息）';
                    alert(`📦 ${data.name}\n作者: ${data.author}\n版本: ${data.version}\n下载: ${data.downloads}\n描述: ${data.description || '无'}\n\n前置依赖:\n${deps}`);
                } catch (e) {
                    showToast('获取详情失败: ' + e.message, 'error');
                }
            }

            // ==================== 下载核心 ====================
            async function downloadCore() {
                const type = coreType.value;
                const version = coreVersion.value.trim() || '1.20.1';
                const build = coreBuild.value.trim() || undefined;
                let mirror = coreMirror.value;
                if (mirror === 'custom') {
                    mirror = customMirrorUrl.value.trim() || 'https://bmclapi2.bangbang93.com';
                } else if (mirror === 'mojang') {
                    mirror = 'https://launcher.mojang.com';
                } else {
                    mirror = 'https://bmclapi2.bangbang93.com';
                }

                if (type === 'mohist' && !build) {
                    showToast('Mohist 需要指定构建号', 'warning');
                    return;
                }

                coreDownloadBtn.disabled = true;
                coreStatus.textContent = '⏳ 已提交...';

                // 核心名 + 版本作为异步任务参数，构建号可选
                const argv = [version];
                if (build) argv.push('--build', build);

                try {
                    // 镜像必须先落配置，再提交下载任务（否则镜像对本次安装不生效）
                    await apiExec(`set download.mirror ${mirror}`);
                    await apiTask(`install ${type}`, argv, `${type}-${version}`, '核心');
                    coreStatus.textContent = '🚀 已加入队列';
                    showToast(`核心 ${type} ${version} 已加入队列，正在后台下载`, 'success', 4000);
                    activateTab('queue');
                    await loadTasks();
                } catch (e) {
                    coreStatus.textContent = '❌ 失败';
                    showToast(`核心下载失败: ${e.message}`, 'error');
                } finally {
                    coreDownloadBtn.disabled = false;
                }
            }

            // ==================== 事件绑定 ====================
            modSearchBtn.addEventListener('click', () => searchContent('mods'));
            modSearchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchContent('mods');
            });
            modVersionFilter.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchContent('mods');
            });
            pluginSearchBtn.addEventListener('click', () => searchContent('plugins'));
            pluginSearchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchContent('plugins');
            });
            pluginVersionFilter.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') searchContent('plugins');
            });

            coreDownloadBtn.addEventListener('click', downloadCore);

            // ==================== 初始化 ====================
            (async function initDownPage() {
                // 1. 先按 URL 参数切 tab（方案页创建成功后会跳到 down.html?tab=queue）
                const params = new URLSearchParams(window.location.search);
                const wantTab = params.get('tab');
                if (wantTab) activateTab(wantTab);

                // 2. 拉一次任务列表，再挂 WebSocket 实时刷新
                await loadTasks();
                connectTaskSocket();
            })();

            // 监听来自父框架的消息
            window.addEventListener('message', (e) => {
                if (e.origin !== window.location.origin) return;
                if (e.data.type === 'search-mod') {
                    modSearchInput.value = e.data.query || '';
                    activateTab('mods');
                    searchContent('mods');
                }
                if (e.data.type === 'search-plugin') {
                    pluginSearchInput.value = e.data.query || '';
                    activateTab('plugins');
                    searchContent('plugins');
                }
                if (e.data.type === 'download-core') {
                    coreType.value = e.data.type || 'vanilla';
                    coreVersion.value = e.data.version || '1.20.1';
                    if (e.data.build) coreBuild.value = e.data.build;
                    activateTab('core');
                }
                if (e.data.type === 'navigate' && e.data.tab) {
                    activateTab(e.data.tab);
                }
            });
        })();
    </script>
</body>
</html>
