<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - wow</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        /* 仪表盘独有样式 — 服务器状态横向布局 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1a2332;
            border-radius: 8px;
            padding: 16px 20px;
            border-left: 4px solid #4CAF50;
            min-width: 0;
        }
        .stat-card .label {
            font-size: 13px;
            color: #8899aa;
            margin-bottom: 4px;
        }
        .stat-card .value {
            font-size: 22px;
            font-weight: 600;
            color: #eee;
        }
        .stat-card .sub {
            font-size: 13px;
            color: #667788;
            margin-top: 4px;
        }
        .stat-card.warning { border-left-color: #ff9800; }
        .stat-card.danger { border-left-color: #f44336; }
        .stat-card.info { border-left-color: #2196F3; }

        .panel {
            background: #141e2b;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: #ccd;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a2332;
        }

        .control-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .control-row .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background: #4CAF50; color: white; }
        .btn-start:hover { background: #43a047; }
        .btn-stop { background: #f44336; color: white; }
        .btn-stop:hover { background: #e53935; }
        .btn-kill { background: #d32f2f; color: white; }
        .btn-kill:hover { background: #b71c1c; }
        .btn-restart { background: #ff9800; color: white; }
        .btn-restart:hover { background: #f57c00; }
        .btn-script { background: #2196F3; color: white; }
        .btn-script:hover { background: #1976D2; }

        .script-box {
            width: 100%;
            padding: 10px 12px;
            background: #0d1520;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #ccd;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            box-sizing: border-box;
        }

        .console-box {
            background: #0a0f18;
            border-radius: 6px;
            padding: 12px 16px;
            height: 280px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #aabbcc;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
            border: 1px solid #1a2332;
        }
        .console-box .log-error { color: #f44336; }
        .console-box .log-warn { color: #ff9800; }
        .console-box .log-info { color: #4CAF50; }
        .console-box .log-dim { color: #556677; }
        /* V3.5.19：Web 端操作回显 */
        .console-box .log-webcli { color: #2196F3; }
        .console-box .log-system { color: #9c88ff; }
        .console-box .log-user { color: #ccd; font-weight: 600; }

        .console-input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .console-input-row input {
            flex: 1;
            padding: 8px 12px;
            background: #0d1520;
            border: 1px solid #1a2332;
            border-radius: 6px;
            color: #ccd;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            outline: none;
        }
        .console-input-row input:focus { border-color: #4CAF50; }
        .console-input-row .btn-send {
            padding: 8px 16px;
            background: #2a3a5e;
            border: none;
            border-radius: 6px;
            color: #ccd;
            cursor: pointer;
        }
        .console-input-row .btn-send:hover { background: #3a4a6e; }

        .quick-cmds {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .quick-cmds .cmd-tag {
            padding: 2px 10px;
            background: #1a2332;
            border-radius: 12px;
            font-size: 12px;
            color: #8899aa;
            cursor: pointer;
            transition: background 0.2s;
        }
        .quick-cmds .cmd-tag:hover {
            background: #2a3a5e;
            color: #eee;
        }

        @media (max-width: 900px) {
            /* 平板 / 窄屏：横向滚动一行，避免纵向堆叠 */
            .dashboard-grid {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 10px;
                padding-bottom: 6px;
                scrollbar-width: thin;
                scroll-snap-type: x proximity;
                -webkit-overflow-scrolling: touch;
            }
            .dashboard-grid .stat-card {
                flex: 0 0 200px;
                scroll-snap-align: start;
            }
        }
        @media (max-width: 600px) {
            /* 手机端：同上但卡片更紧凑 */
            .dashboard-grid .stat-card {
                flex: 0 0 180px;
                padding: 12px 14px;
            }
            .stat-card .value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <!-- 统计卡片 -->
        <div class="dashboard-grid" id="stats-grid">
            <div class="stat-card">
                <div class="label">💻 CPU 占用</div>
                <div class="value" id="stat-cpu">--%</div>
                <div class="sub">实时</div>
            </div>
            <div class="stat-card">
                <div class="label">🧠 内存占用</div>
                <div class="value" id="stat-mem">-- MB</div>
                <div class="sub">已分配 / 总量</div>
            </div>
            <div class="stat-card">
                <div class="label">🌐 网络流量</div>
                <div class="value" id="stat-net">-- / --</div>
                <div class="sub">入 / 出</div>
            </div>
            <div class="stat-card info">
                <div class="label">⏱️ 运行时间</div>
                <div class="value" id="stat-uptime">--</div>
                <div class="sub">已运行</div>
            </div>
            <div class="stat-card info">
                <div class="label">📦 当前方案</div>
                <div class="value" id="stat-scheme">--</div>
                <div class="sub">方案名称</div>
            </div>
            <div class="stat-card info">
                <div class="label">👥 玩家数量</div>
                <div class="value" id="stat-players">0</div>
                <div class="sub">在线玩家</div>
            </div>
        </div>

        <!-- V3.6.2（607）：JVM 配置已全部移至「设置」页（JVM 模板下拉 + 覆盖参数 + 最终启动预览） -->

        <!-- 服务器控制 -->
        <div class="panel">
            <div class="panel-title">🎮 服务器控制</div>
            <div class="control-row">
                <button class="btn btn-start" id="btn-start">▶ 启动</button>
                <button class="btn btn-stop" id="btn-stop">⏹ 停止</button>
                <button class="btn btn-kill" id="btn-kill">✖ 强制停止</button>
                <button class="btn btn-restart" id="btn-restart">⟳ 重启</button>
            </div>
            <div style="margin-top:10px;color:#8899aa;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;">
                <span id="server-status-label">状态: 未知</span>
                <span id="server-pid">PID: --</span>
                <span id="console-relay">控制台通道: --</span>
            </div>
        </div>

        <!-- 控制台 -->
        <div class="panel">
            <div class="panel-title">🖥️ 控制台</div>
            <div class="console-box" id="console-box">
                <span class="log-dim">[系统] 等待服务器日志...</span>
            </div>
            <div class="console-input-row">
                <input type="text" id="console-input" placeholder="输入命令..." spellcheck="false" />
                <button class="btn-send" id="console-send">发送</button>
            </div>
            <div class="quick-cmds" id="quick-cmds">
                <span class="cmd-tag" data-cmd="list">list</span>
                <span class="cmd-tag" data-cmd="save-all">save-all</span>
                <span class="cmd-tag" data-cmd="say 服务器正在运行">say 公告</span>
                <span class="cmd-tag" data-cmd="stop">stop</span>
                <span class="cmd-tag" data-cmd="reload">reload</span>
            </div>
        </div>
    </div>

    <!-- V3.5.19：日志改为 WebSocket 实时推送（socket.io 客户端由服务端自动托管） -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        (function() {
            // ==================== 状态与引用 ====================
            const token = sessionStorage.getItem('wow_token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            const consoleBox = document.getElementById('console-box');
            const consoleInput = document.getElementById('console-input');
            const sendBtn = document.getElementById('console-send');
            const startBtn = document.getElementById('btn-start');
            const stopBtn = document.getElementById('btn-stop');
            const killBtn = document.getElementById('btn-kill');
            const restartBtn = document.getElementById('btn-restart');
            const statusLabel = document.getElementById('server-status-label');
            const pidLabel = document.getElementById('server-pid');
            const relayLabel = document.getElementById('console-relay');

            // 统计元素
            const statCpu = document.getElementById('stat-cpu');
            const statMem = document.getElementById('stat-mem');
            const statNet = document.getElementById('stat-net');
            const statUptime = document.getElementById('stat-uptime');
            const statScheme = document.getElementById('stat-scheme');
            const statPlayers = document.getElementById('stat-players');

            let statusPollTimer = null;
            let fallbackLogTimer = null;
            let currentScheme = '--';
            let serverRunning = false;

            // ==================== API 调用封装 ====================
            async function apiExec(command, args = []) {
                const resp = await fetch('/api/exec', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ command, args })
                });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || '命令执行失败');
                }
                return await resp.json();
            }

            async function apiGet(path) {
                const resp = await fetch(path, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!resp.ok) throw new Error('请求失败');
                return await resp.json();
            }

            async function apiPost(path, body) {
                const resp = await fetch(path, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(body)
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || '请求失败');
                return data;
            }

            // ==================== 控制台渲染 ====================
            // 统一走 buffer 渲染：既有历史日志，也有 WebSocket 增量，还混着
            // [WebCLI] / [System] 这类回显，逐条 append 比整块重绘更省事也不闪。
            const MAX_CONSOLE_LINES = 400;
            const consoleLines = [];

            function classify(line) {
                if (line.startsWith('[WebCLI]')) return 'log-webcli';
                if (line.startsWith('[System]')) return 'log-system';
                if (line.startsWith('> ')) return 'log-user';
                if (/\bERROR\b|\bFATAL\b|Exception|错误/i.test(line)) return 'log-error';
                if (/\bWARN\b|警告/i.test(line)) return 'log-warn';
                if (/\bINFO\b/.test(line)) return 'log-info';
                return 'log-dim';
            }

            function appendConsole(line, kind) {
                if (!line) return;
                const cls = kind === 'webcli' ? 'log-webcli'
                    : kind === 'system' ? 'log-system'
                    : classify(line);
                consoleLines.push({ line, cls });
                if (consoleLines.length > MAX_CONSOLE_LINES) {
                    consoleLines.splice(0, consoleLines.length - MAX_CONSOLE_LINES);
                }
                renderConsole();
            }

            function renderConsole() {
                // 首次渲染前清掉占位提示
                if (consoleLines.length === 0) return;
                consoleBox.innerHTML = consoleLines.map(({ line, cls }) =>
                    `<span class="${cls}">${escapeHtml(line)}</span>`
                ).join('\n');
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ==================== 更新仪表盘 ====================
            async function updateDashboard() {
                try {
                    const status = await apiGet('/api/status');
                    serverRunning = status.running === true;

                    statusLabel.textContent = serverRunning ? '✅ 运行中' : '⏹️ 已停止';
                    statusLabel.style.color = serverRunning ? '#4CAF50' : '#f44336';

                    // V3.5.19：PID 不再是空白——后端 /api/status 明确返回 pid
                    pidLabel.textContent = serverRunning
                        ? `PID: ${status.pid || '未知'}`
                        : 'PID: --';

                    relayLabel.textContent = status.consoleRelay
                        ? '控制台通道: ✅ 可发送指令'
                        : (serverRunning ? '控制台通道: ⚠️ 未就绪（请重启服务端）' : '控制台通道: --');
                    relayLabel.style.color = status.consoleRelay ? '#4CAF50' : '#8899aa';

                    if (status.scheme) {
                        currentScheme = status.scheme;
                        statScheme.textContent = currentScheme;
                    }

                    // 运行指标（CPU / 内存 / 时长 / 人数）
                    try {
                        const m = await apiGet('/api/metrics');
                        statCpu.textContent = m.cpu || '0%';
                        statMem.textContent = m.memory || '0 MB';
                        statUptime.textContent = m.uptime || '0s';
                        statPlayers.textContent = m.players || 0;
                        // 网络流量暂无采集源，保持占位而不是伪造数字
                        statNet.textContent = '—';
                    } catch (e) { /* 指标拿不到不影响状态展示 */ }
                } catch (e) {
                    console.warn('更新仪表盘失败:', e);
                }
            }

            // ==================== 日志：WebSocket 实时推送 ====================
            async function loadHistory() {
                try {
                    const data = await apiGet('/api/logs?lines=80');
                    if (Array.isArray(data.logs) && data.logs.length) {
                        consoleLines.length = 0;
                        for (const line of data.logs) appendConsole(line);
                    }
                } catch (e) { /* 历史日志读不到也能靠实时推送继续用 */ }
            }

            let socket = null;
            function connectSocket() {
                if (typeof io !== 'function') {
                    // 极端情况（主题包缺少 socket.io 客户端）：退化为低频轮询
                    startFallbackPolling();
                    return;
                }
                socket = io({ auth: { token } });

                socket.on('log', (p) => {
                    if (p && p.line) appendConsole(p.line);
                });

                // V3.5.19：[WebCLI] / [System] 回显
                socket.on('console', (p) => {
                    if (p && p.line) appendConsole(p.line, p.kind);
                });

                socket.on('connect', () => {
                    appendConsole('[系统] 日志已切换为 WebSocket 实时推送', 'system');
                    if (fallbackLogTimer) { clearInterval(fallbackLogTimer); fallbackLogTimer = null; }
                });

                socket.on('disconnect', () => {
                    appendConsole('[系统] 实时连接已断开，正在尝试重连…', 'system');
                    startFallbackPolling();
                });
            }

            // 断线兜底：低频轮询最近日志，重连成功后自动停掉
            let lastFallbackText = '';
            function startFallbackPolling() {
                if (fallbackLogTimer) return;
                fallbackLogTimer = setInterval(async () => {
                    if (socket && socket.connected) {
                        clearInterval(fallbackLogTimer);
                        fallbackLogTimer = null;
                        return;
                    }
                    try {
                        const data = await apiGet('/api/logs?lines=40');
                        const text = (data.logs || []).join('\n');
                        if (text && text !== lastFallbackText) {
                            lastFallbackText = text;
                            for (const line of data.logs.slice(-10)) appendConsole(line);
                        }
                    } catch (e) { /* 静默 */ }
                }, 3000);
            }

            // ==================== 服务器控制 ====================
            async function serverAction(action, options = {}) {
                const cmdMap = {
                    start: 'server start',
                    stop: 'server stop',
                    kill: 'server kill',
                    restart: 'server restart'
                };
                const cmd = cmdMap[action];
                if (!cmd) return;
                try {
                    statusLabel.textContent = '⏳ 执行中...';
                    appendConsole(`> ${cmd}`, 'user');
                    await apiExec(cmd, []);
                    // start/restart 会等 Java 起来才返回，这里再补一次刷新
                    setTimeout(updateDashboard, 1000);
                } catch (e) {
                    appendConsole(`操作失败: ${e.message}`, 'system');
                    statusLabel.textContent = '❌ 失败';
                    setTimeout(updateDashboard, 1500);
                }
            }

            // ==================== 控制台命令 ====================
            // V3.5.19：这里发的是「Minecraft 控制台指令」，必须走 /api/console。
            // 旧实现走 /api/exec（= 执行 wow 子命令），所以敲 list 会被当成 `wow list`，
            // 回一句 unknown command —— 这正是需求里说的「Unknown command」。
            async function sendConsoleCommand(raw) {
                const cmd = String(raw == null ? '' : raw).replace(/[\r\n]+/g, ' ').trim();
                if (!cmd) return;
                consoleInput.value = '';
                appendConsole(`> ${cmd}`, 'user');

                if (!serverRunning) {
                    appendConsole('服务器未运行，指令未发送。请先点击「启动」。', 'system');
                    return;
                }
                try {
                    await apiPost('/api/console', { line: cmd });
                } catch (e) {
                    appendConsole(`发送失败: ${e.message}`, 'system');
                }
            }

            // ==================== 事件绑定 ====================
            startBtn.addEventListener('click', () => serverAction('start'));
            stopBtn.addEventListener('click', () => serverAction('stop'));
            killBtn.addEventListener('click', () => serverAction('kill'));
            restartBtn.addEventListener('click', () => serverAction('restart'));

            sendBtn.addEventListener('click', () => {
                sendConsoleCommand(consoleInput.value);
            });
            consoleInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendConsoleCommand(consoleInput.value);
                }
            });

            // 快速命令标签
            document.querySelectorAll('.cmd-tag').forEach(el => {
                el.addEventListener('click', () => {
                    const cmd = el.dataset.cmd;
                    if (cmd) sendConsoleCommand(cmd);
                });
            });

            // ==================== 初始化 ====================
            async function init() {
                consoleBox.innerHTML = '';
                await updateDashboard();
                await loadHistory();
                connectSocket();

                statusPollTimer = setInterval(updateDashboard, 5000);
            }

            window.addEventListener('beforeunload', () => {
                if (statusPollTimer) clearInterval(statusPollTimer);
                if (fallbackLogTimer) clearInterval(fallbackLogTimer);
                if (socket) socket.close();
            });

            init().catch(e => console.warn('初始化失败:', e));
        })();
    </script>
</body>
</html>
