<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wow Minecraft 服务器管理</title>
    <!-- 全局样式 -->
    <link rel="stylesheet" href="/css/main.css" />
    <!-- 内置帮助文档抽屉样式 -->
    <link rel="stylesheet" href="/css/docs.css" />
</head>
<body class="shell">
    <!-- 整个页面使用 flex 布局 -->
    <div id="app">
        <!-- 左侧菜单栏 iframe -->
        <iframe id="menu-frame" src="/left.html" scrolling="no"></iframe>

        <!-- 中间主内容区域 -->
        <div id="main-content">
            <iframe id="content-frame" src="/dashboard.html"></iframe>
        </div>

        <!-- 右侧便签栏 iframe（聊天室，以登录邮箱为发言人） -->
        <iframe id="notify-frame" src="/right.html" scrolling="no"></iframe>
    </div>

    <!-- ===== 移动端顶栏 + 遮罩（≤768px 显示，用于唤出左菜单 / 右便签抽屉） ===== -->
    <div id="mobile-topbar">
        <button id="mobile-menu-btn" type="button" aria-label="打开菜单" title="菜单">☰</button>
        <span id="mobile-title">wow 服务器管理</span>
        <button id="mobile-notify-btn" type="button" aria-label="打开便签" title="便签">便签</button>
    </div>
    <div id="mobile-backdrop"></div>

    <!-- ===== 内置帮助文档抽屉（顶层覆盖整个面板，不受 iframe 裁剪） ===== -->
    <div id="docs-overlay" class="docs-overlay" aria-hidden="true">
        <aside id="docs-drawer" class="docs-drawer" role="dialog" aria-modal="true" aria-label="帮助文档">
            <header class="docs-drawer-head">
                <div class="docs-drawer-title">
                    <span>📖</span>
                    <h3>帮助文档</h3>
                    <span class="docs-drawer-sub">docs/</span>
                </div>
                <button id="docs-close-btn" class="docs-close-btn" type="button" title="关闭（Esc）" aria-label="关闭">✕</button>
            </header>
            <div class="docs-body">
                <nav id="docs-nav" class="docs-sidebar" aria-label="文档目录"></nav>
                <main id="docs-content" class="docs-content">
                    <div class="docs-loading">正在加载文档…</div>
                </main>
            </div>
            <div id="docs-toast" class="docs-toast" role="status" aria-live="polite"></div>
        </aside>
    </div>

    <!-- Markdown 渲染依赖：本地 vendor，离线可用，绝不走 CDN -->
    <script src="/js/vendor/marked.min.js"></script>
    <script src="/js/vendor/purify.min.js"></script>
    <script src="/js/docs_viewer.js"></script>

    <!-- 全局 JavaScript -->
    <script src="/js/main.js"></script>
    <script src="/js/auth_guard.js"></script>
    <script>
        (function() {
            // 等待 DOM 加载完成
            document.addEventListener('DOMContentLoaded', async function() {
                // 登录闸门：web.require_login=false 时完全免登录
                if (!(await wowAuthGuard())) return;

                // 监听来自 left.html 的菜单切换消息
                window.addEventListener('message', function(event) {
                    // 只接受来自同源的消息
                    if (event.origin !== window.location.origin) return;
                    if (event.data.type === 'navigate') {
                        const page = event.data.page;
                        if (!page) return;
                        const contentFrame = document.getElementById('content-frame');
                        // 所有页面都在根目录下，直接拼接
                        // V3.5.19：支持 tab 透传，例如方案页创建成功后跳「下载页-任务队列」
                        //   { type:'navigate', page:'down', tab:'queue' } → /down.html?tab=queue
                        let url = '/' + page + '.html';
                        if (event.data.tab) {
                            url += '?tab=' + encodeURIComponent(event.data.tab);
                        }
                        contentFrame.src = url;
                        // 同步左侧菜单高亮
                        const menuFrame = document.getElementById('menu-frame');
                        try {
                            menuFrame.contentWindow.postMessage(
                                { type: 'set-active', page: page }, window.location.origin
                            );
                        } catch (e) { /* 菜单尚未加载完成，忽略 */ }
                        // 移动端：选中菜单项后自动收起左抽屉，露出内容
                        document.body.classList.remove('menu-open');
                    }
                });

                // ===== 移动端：顶栏 ☰ / 💬 与遮罩，用于唤出左菜单 / 右便签抽屉 =====
                const mobileMenuBtn = document.getElementById('mobile-menu-btn');
                const mobileNotifyBtn = document.getElementById('mobile-notify-btn');
                const mobileBackdrop = document.getElementById('mobile-backdrop');
                function closeDrawers() {
                    document.body.classList.remove('menu-open', 'notify-open');
                }
                if (mobileMenuBtn) {
                    mobileMenuBtn.addEventListener('click', function() {
                        const open = document.body.classList.toggle('menu-open');
                        if (open) document.body.classList.remove('notify-open');
                    });
                }
                if (mobileNotifyBtn) {
                    mobileNotifyBtn.addEventListener('click', function() {
                        const open = document.body.classList.toggle('notify-open');
                        if (open) document.body.classList.remove('menu-open');
                    });
                }
                if (mobileBackdrop) {
                    mobileBackdrop.addEventListener('click', closeDrawers);
                }
                // 按 Esc 关闭任意已打开的抽屉
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeDrawers();
                });

                // 监听来自 right.html 的通知栏关闭/展开消息（可选）
                window.addEventListener('message', function(event) {
                    if (event.origin !== window.location.origin) return;
                    if (event.data.type === 'toggle-notify') {
                        const notifyFrame = document.getElementById('notify-frame');
                        if (event.data.collapsed) {
                            notifyFrame.classList.add('collapsed');
                        } else {
                            notifyFrame.classList.remove('collapsed');
                        }
                    }
                });

                // 当主内容 iframe 加载完成时，通知它当前页面的信息（可选）
                const contentFrame = document.getElementById('content-frame');
                contentFrame.addEventListener('load', function() {
                    // 可以在这里统一处理，暂不实现
                });
            });
        })();
    </script>
</body>
</html>
