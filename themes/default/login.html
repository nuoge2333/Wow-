<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - wow 服务器管理</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        /* 登录页单独样式，尽量简洁 */
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-container {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            color: #eee;
        }
        .login-container h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 8px;
            font-weight: 400;
        }
        .login-container .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #2a3a5e;
            border-radius: 6px;
            background: #0f1a2f;
            color: #eee;
            font-size: 15px;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #45a049;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-msg {
            color: #f44336;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }
        .success-msg {
            color: #4CAF50;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }
        .code-row {
            display: flex;
            gap: 10px;
        }
        .code-row input {
            flex: 1;
        }
        .code-row .btn-secondary {
            padding: 10px 16px;
            background: #2a3a5e;
            border: none;
            border-radius: 6px;
            color: #eee;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .code-row .btn-secondary:hover {
            background: #3a4a6e;
        }
        .code-row .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 指令二：验证码 / 密码双通道 Tab（未设密码时不显示） */
        .login-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }
        .login-tabs button {
            flex: 1;
            padding: 9px 0;
            border-radius: 6px;
            border: 1px solid #2a3a5e;
            background: #0f1a2f;
            color: #8899aa;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-tabs button.active {
            background: #1d2b45;
            border-color: #4CAF50;
            color: #eee;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
        }
        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🎮 wow</h1>
        <div class="sub">Minecraft 服务器管理面板</div>

        <div class="login-tabs" id="login-tabs" style="display:none;">
            <button type="button" class="active" data-tab="code">验证码登录</button>
            <button type="button" data-tab="password">密码登录</button>
        </div>

        <div id="login-form">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" placeholder="your@email.com" autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-row">
                    <input type="text" id="code" placeholder="6位数字验证码" maxlength="6" autocomplete="one-time-code" />
                    <button class="btn-secondary" id="send-code-btn">获取验证码</button>
                </div>
            </div>
            <button class="btn-primary" id="login-btn">登录</button>
            <div id="message" class="error-msg"></div>
        </div>

        <!-- 密码登录：仅当 wow.yaml 里已设置 web.auth_password 时才显示 -->
        <div id="password-form" style="display:none;">
            <div class="form-group">
                <label for="login-password">登录密码</label>
                <input type="password" id="login-password" placeholder="输入面板登录密码" autocomplete="current-password" />
            </div>
            <button class="btn-primary" id="password-login-btn">登录</button>
            <div id="password-message" class="error-msg"></div>
        </div>

        <div class="footer">
            验证码将发送到您的邮箱 · <a href="#" id="privacy-link">隐私说明</a>
        </div>
    </div>

    <script>
        (function() {
            const emailInput = document.getElementById('email');
            const codeInput = document.getElementById('code');
            const sendBtn = document.getElementById('send-code-btn');
            const loginBtn = document.getElementById('login-btn');
            const msgEl = document.getElementById('message');

            // 指令二：密码登录（备用钥匙）。未设置密码时整条通道不出现。
            const tabsEl = document.getElementById('login-tabs');
            const loginFormEl = document.getElementById('login-form');
            const passwordFormEl = document.getElementById('password-form');
            const passwordInput = document.getElementById('login-password');
            const passwordBtn = document.getElementById('password-login-btn');
            const passwordMsgEl = document.getElementById('password-message');
            let activeTab = 'code';

            let countdown = 0;
            let timer = null;

            // 清除消息
            function setMessage(text, isError = true) {
                msgEl.textContent = text;
                msgEl.className = isError ? 'error-msg' : 'success-msg';
            }

            // 发送验证码
            async function sendCode() {
                const email = emailInput.value.trim();
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    setMessage('请输入有效的邮箱地址');
                    return;
                }

                sendBtn.disabled = true;
                setMessage('发送中...', false);

                try {
                    const resp = await fetch('/api/auth/request-code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success) {
                        setMessage('验证码已发送，请查收邮件', false);
                        // 倒计时
                        countdown = 60;
                        updateSendBtn();
                        timer = setInterval(() => {
                            countdown--;
                            updateSendBtn();
                            if (countdown <= 0) {
                                clearInterval(timer);
                                timer = null;
                                sendBtn.disabled = false;
                                sendBtn.textContent = '获取验证码';
                            }
                        }, 1000);
                    } else {
                        setMessage(data.error || '发送失败，请重试');
                        sendBtn.disabled = false;
                    }
                } catch (e) {
                    setMessage('网络错误，请检查连接');
                    sendBtn.disabled = false;
                }
            }

            function updateSendBtn() {
                if (countdown > 0) {
                    sendBtn.textContent = countdown + 's';
                } else {
                    sendBtn.textContent = '获取验证码';
                }
            }

            // ===== 指令二：验证码 / 密码双通道 =====
            function setPasswordMessage(text, isError = true) {
                passwordMsgEl.textContent = text;
                passwordMsgEl.className = isError ? 'error-msg' : 'success-msg';
            }

            function switchTab(tab) {
                activeTab = tab === 'password' ? 'password' : 'code';
                loginFormEl.style.display = activeTab === 'code' ? 'block' : 'none';
                passwordFormEl.style.display = activeTab === 'password' ? 'block' : 'none';
                tabsEl.querySelectorAll('button').forEach((b) => {
                    b.classList.toggle('active', b.getAttribute('data-tab') === activeTab);
                });
                if (activeTab === 'password') passwordInput.focus();
            }

            // 没设置密码就只保留验证码登录（接口挂了也照常能用，fail-safe）
            async function loadAuthModes() {
                try {
                    const resp = await fetch('/api/auth/config', { credentials: 'same-origin' });
                    if (!resp.ok) return;
                    const cfg = await resp.json();
                    if (cfg && cfg.password_enabled === true) {
                        tabsEl.style.display = 'flex';
                        switchTab('code');
                    }
                } catch (e) { /* 保持纯验证码登录 */ }
            }

            async function loginWithPassword() {
                const password = passwordInput.value;
                if (!password) {
                    setPasswordMessage('请输入登录密码');
                    return;
                }
                passwordBtn.disabled = true;
                setPasswordMessage('登录中...', false);
                try {
                    const resp = await fetch('/api/auth/login-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    const data = await resp.json().catch(() => ({}));
                    if (resp.ok && data.success && data.token) {
                        sessionStorage.setItem('wow_token', data.token);
                        setPasswordMessage('登录成功，正在跳转...', false);
                        window.location.href = '/index.html';
                        return;
                    }
                    if (resp.status === 429) {
                        const sec = Number(data.retry_after_seconds) || 0;
                        const mins = sec > 0 ? Math.ceil(sec / 60) : 15;
                        setPasswordMessage(`尝试过于频繁，请约 ${mins} 分钟后再试`);
                    } else {
                        setPasswordMessage(data.error || '密码错误');
                    }
                    passwordBtn.disabled = false;
                } catch (e) {
                    setPasswordMessage('网络错误，请检查连接');
                    passwordBtn.disabled = false;
                }
            }

            // 登录
            async function login() {
                const email = emailInput.value.trim();
                const code = codeInput.value.trim();
                if (!email) {
                    setMessage('请输入邮箱');
                    return;
                }
                if (!code || code.length !== 6) {
                    setMessage('请输入6位验证码');
                    return;
                }

                loginBtn.disabled = true;
                setMessage('登录中...', false);

                try {
                    const resp = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, code })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success && data.token) {
                        // 保存 token 到 sessionStorage，关闭页面即失效
                        sessionStorage.setItem('wow_token', data.token);
                        setMessage('登录成功，正在跳转...', false);
                        // 跳转到主框架
                        window.location.href = '/index.html';
                    } else {
                        setMessage(data.error || '登录失败，请检查验证码');
                        loginBtn.disabled = false;
                    }
                } catch (e) {
                    setMessage('网络错误，请检查连接');
                    loginBtn.disabled = false;
                }
            }

            // 事件绑定
            sendBtn.addEventListener('click', sendCode);
            loginBtn.addEventListener('click', login);
            passwordBtn.addEventListener('click', loginWithPassword);
            tabsEl.querySelectorAll('button').forEach((b) => {
                b.addEventListener('click', () => switchTab(b.getAttribute('data-tab')));
            });

            // 回车键触发登录（按当前 Tab 分派）
            codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') login();
            });
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') loginWithPassword();
            });
            emailInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    if (codeInput.value.length === 6) login();
                    else sendCode();
                }
            });

            // 如果已经登录，直接跳转到主页
            const token = sessionStorage.getItem('wow_token');
            if (token) {
                // 验证 token 是否有效
                fetch('/api/auth/verify', {
                    headers: { 'Authorization': 'Bearer ' + token }
                }).then(res => res.json())
                .then(data => {
                    if (data.valid) {
                        window.location.href = '/index.html';
                    } else {
                        sessionStorage.removeItem('wow_token');
                    }
                }).catch(() => {
                    sessionStorage.removeItem('wow_token');
                });
            }

            // 隐私说明（占位）
            document.getElementById('privacy-link').addEventListener('click', (e) => {
                e.preventDefault();
                alert('您的邮箱仅用于本服务器登录验证，不会存储或转发至任何第三方。');
            });

            // 决定是否显示「密码登录」通道
            loadAuthModes();
        })();
    </script>
</body>
</html>
