name: CI

# 公测前的回归闸门：任何一次 push / PR 都跑一遍全量测试。
# 只跑 Linux：pty、文件权限、信号处理这些用例在 Linux 上才有意义，
# Windows / macOS 上的行为差异留给人工冒烟（见 docs/trouble/）。
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # engines 已声明 >=20（nodemailer 10 的要求），所以从 20 起测
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: core/package-lock.json

      - name: 安装依赖（严格按锁文件）
        working-directory: core
        run: npm ci --no-audit --no-fund

      - name: 语法检查
        working-directory: core
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -r -n1 node --check
        shell: bash

      - name: 全量测试
        working-directory: core
        run: npm test
